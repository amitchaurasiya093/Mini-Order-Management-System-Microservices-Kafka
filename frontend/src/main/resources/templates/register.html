<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - MiniOrder</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>


<body class="min-h-screen bg-slate-50">


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="bg-white border-b border-slate-200">

    <div class="max-w-7xl mx-auto px-6 lg:px-8">

        <div class="h-16 flex items-center justify-between">


            <!-- Logo -->

            <a th:href="@{/}"
               class="flex items-center gap-3">

                <div class="w-10 h-10
                            rounded-xl
                            bg-blue-600
                            text-white
                            flex items-center
                            justify-center
                            font-bold
                            shadow-md">

                    MO

                </div>

                <span class="text-xl
                             font-bold
                             text-slate-800">

                    MiniOrder

                </span>

            </a>


            <!-- Login Link -->

            <div class="text-sm text-slate-600">

                Already have an account?

                <a th:href="@{/login}"
                   class="text-blue-600
                          font-semibold
                          hover:text-blue-700">

                    Login

                </a>

            </div>

        </div>

    </div>

</nav>



<!-- =====================================================
     REGISTER SECTION
===================================================== -->

<main class="min-h-[calc(100vh-64px)]
             flex
             items-center
             justify-center
             px-6
             py-12">


    <div class="w-full max-w-md">


        <!-- Heading -->

        <div class="text-center mb-8">

            <div class="mx-auto
                        w-14 h-14
                        rounded-2xl
                        bg-blue-600
                        text-white
                        flex
                        items-center
                        justify-center
                        text-xl
                        font-bold
                        shadow-lg
                        mb-5">

                MO

            </div>


            <h1 class="text-3xl
                       font-bold
                       text-slate-900">

                Create Your Account

            </h1>


            <p class="mt-2
                      text-slate-500">

                Register to start managing your orders.

            </p>

        </div>



        <!-- Register Card -->

        <div class="bg-white
                    rounded-2xl
                    shadow-xl
                    border
                    border-slate-200
                    p-8">


            <!-- Message -->

            <div id="registerMessage"
                 class="hidden
                        mb-5
                        p-4
                        rounded-lg
                        text-sm">
            </div>



            <!-- Register Form -->

            <form id="registerForm">


                <!-- Username -->

                <div class="mb-5">

                    <label for="username"
                           class="block
                                  text-sm
                                  font-semibold
                                  text-slate-700
                                  mb-2">

                        Username

                    </label>


                    <input type="text"
                           id="username"
                           name="username"
                           placeholder="Enter username"
                           required
                           class="w-full
                                  px-4
                                  py-3
                                  border
                                  border-slate-300
                                  rounded-xl
                                  outline-none
                                  focus:ring-2
                                  focus:ring-blue-500
                                  focus:border-blue-500
                                  transition">

                </div>



                <!-- Password -->

                <div class="mb-5">

                    <label for="password"
                           class="block
                                  text-sm
                                  font-semibold
                                  text-slate-700
                                  mb-2">

                        Password

                    </label>


                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Enter password"
                           required
                           class="w-full
                                  px-4
                                  py-3
                                  border
                                  border-slate-300
                                  rounded-xl
                                  outline-none
                                  focus:ring-2
                                  focus:ring-blue-500
                                  focus:border-blue-500
                                  transition">

                </div>



                <!-- Confirm Password -->

                <div class="mb-6">

                    <label for="confirmPassword"
                           class="block
                                  text-sm
                                  font-semibold
                                  text-slate-700
                                  mb-2">

                        Confirm Password

                    </label>


                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           placeholder="Confirm password"
                           required
                           class="w-full
                                  px-4
                                  py-3
                                  border
                                  border-slate-300
                                  rounded-xl
                                  outline-none
                                  focus:ring-2
                                  focus:ring-blue-500
                                  focus:border-blue-500
                                  transition">

                </div>



                <!-- Register Button -->

                <button type="submit"
                        class="w-full
                               py-3.5
                               bg-blue-600
                               text-white
                               font-semibold
                               rounded-xl
                               hover:bg-blue-700
                               active:bg-blue-800
                               transition
                               shadow-md">

                    Create Account

                </button>

            </form>



            <!-- Login -->

            <div class="mt-6
                        text-center
                        text-sm
                        text-slate-500">

                Already have an account?

                <a th:href="@{/login}"
                   class="text-blue-600
                          font-semibold
                          hover:text-blue-700">

                    Login here

                </a>

            </div>

        </div>



        <!-- Back to Home -->

        <div class="text-center mt-6">

            <a th:href="@{/}"
               class="text-sm
                      text-slate-500
                      hover:text-blue-600">

                ← Back to Home

            </a>

        </div>

    </div>

</main>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script th:src="@{/js/auth.js}"></script>


</body>

</html>
